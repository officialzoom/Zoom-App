kind = "web"
previewPath = "/"
title = "Zoom NG"
version = "1.0.0"
id = "artifacts/zoom-ng"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20833

[services.development]
run = "pnpm --filter @workspace/zoom-ng run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/zoom-ng", "run", "build" ]
publicDir = "artifacts/zoom-ng/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20833"
BASE_PATH = "/"
